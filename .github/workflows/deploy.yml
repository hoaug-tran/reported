name: CI/CD Pipeline & Remote Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: 'Deploy to server.trkhoang.com'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoaug
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: reported_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts
        run: pnpm --filter @reported/contracts build

      - name: Build Database Layer
        run: pnpm --filter @reported/database build

      - name: Build Backend API
        run: pnpm --filter @reported/api build

      - name: Build Web Application
        run: pnpm --filter @reported/web build

      - name: Run Database Migrations for Tests
        env:
          DATABASE_URL: postgresql://hoaug:testpassword123@localhost:5432/reported_test
        run: pnpm --filter @reported/database db:migrate

      - name: Run Unit & Security Tests
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_reported_ci_pipeline_token_secret_key_32
          SESSION_SECRET: test_session_secret_reported_ci_pipeline_token_secret_key_32
          DATABASE_URL: postgresql://hoaug:testpassword123@localhost:5432/reported_test
        run: pnpm test

  deploy:
    name: Zero-Downtime Deploy to server.trkhoang.com
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.deploy_to_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || 'server.trkhoang.com' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
          SSH_USER: ${{ secrets.SSH_USER || 'hoaug' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync Code to Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || 'server.trkhoang.com' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
          SSH_USER: ${{ secrets.SSH_USER || 'hoaug' }}
        run: |
          tar --exclude="node_modules" \
              --exclude=".git" \
              --exclude="dist" \
              --exclude=".cache" \
              --exclude=".env" \
              --exclude="*.log" \
              -czf - . | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /home/$SSH_USER/reported && tar -xzf - -C /home/$SSH_USER/reported"

      - name: Execute Docker Compose Build & Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || 'server.trkhoang.com' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '2222' }}
          SSH_USER: ${{ secrets.SSH_USER || 'hoaug' }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            cd /home/$SSH_USER/reported

            if [ -n \"$PRODUCTION_ENV\" ]; then
              echo \"$PRODUCTION_ENV\" > .env
              echo 'Updated .env from GitHub Secret PRODUCTION_ENV'
            elif [ ! -f .env ] && [ -f .env.production ]; then
              cp .env.production .env
            fi

            echo 'Starting Docker Compose Build...'
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo 'Waiting for services to become healthy...'
            sleep 8

            docker compose -f docker-compose.prod.yml ps

            echo 'Cleaning up dangling images...'
            docker image prune -f || true

            echo 'Deployment finished successfully!'
          "
